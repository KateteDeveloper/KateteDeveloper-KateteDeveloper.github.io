<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 배경 부드러운 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D54AA"/>
      <stop offset="100%" stop-color="#0E235C"/>
    </linearGradient>

    <!-- 캐릭터 몸체 그라데이션 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5588E8"/>
      <stop offset="100%" stop-color="#3665CB"/>
    </linearGradient>
  </defs>

  <!-- 메인 둥근 사각 배경 (바깥 검정색 영역 제거) -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#bgGrad)"/>

  <!-- 캐릭터 그룹 -->
  <g id="owl-character">
    <!-- 발 (왼쪽, 오른쪽) -->
    <g fill="#FFAE00">
      <!-- 왼쪽 발 -->
      <path d="M 218 360 L 218 385 C 218 396 210 405 192 405 C 174 405 170 392 170 382 C 170 372 188 372 196 372 L 196 360 Z"/>
      <!-- 오른쪽 발 -->
      <path d="M 294 360 L 294 385 C 294 396 302 405 320 405 C 338 405 342 392 342 382 C 342 372 324 372 316 372 L 316 360 Z"/>
    </g>

    <!-- 날개/손 흔드는 팔 (오른쪽 위) -->
    <path d="M 340 180 C 375 140 435 150 415 220 C 400 260 355 270 340 255 Z" fill="#4B7BDC"/>

    <!-- 몸통 및 왼쪽 날개 베이스 -->
    <!-- 왼쪽 접힌 날개 -->
    <path d="M 175 160 C 120 180 95 250 115 320 C 130 350 165 340 175 330 Z" fill="#3D6ECF"/>

    <!-- 머리 깃털/귀 포함 몸통 실루엣 -->
    <path d="M 160 145 
             C 175 100 230 110 256 135 
             C 285 110 335 100 355 145 
             C 380 190 385 305 350 345 
             C 310 380 200 380 160 345 
             C 125 305 130 190 160 145 Z" 
          fill="url(#bodyGrad)"/>

    <!-- 눈 흰자 (연결된 안경/마스크 형태) -->
    <g id="eyes-white">
      <path d="M 145 228 
               C 145 180 195 148 240 162 
               C 249 165 256 172 256 178 
               C 256 172 263 165 272 162 
               C 317 148 367 180 367 228 
               C 367 278 315 292 272 280 
               C 262 277 256 270 256 270 
               C 256 270 250 277 240 280 
               C 197 292 145 278 145 228 Z" 
            fill="#FFFFFF"/>
    </g>

    <!-- 눈동자 -->
    <circle cx="216" cy="226" r="14" fill="#111111"/>
    <circle cx="296" cy="226" r="14" fill="#111111"/>

    <!-- 부리 -->
    <polygon points="256,242 245,264 267,264" fill="#FFA500"/>
  </g>
</svg>
